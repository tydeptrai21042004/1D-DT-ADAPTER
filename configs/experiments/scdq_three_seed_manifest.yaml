schema_version: 2
scope: cnn_classification_scdq_ablation
default_seeds:
- 0
- 1
- 2
description: Caltech101/ResNet-18 three-seed ablation isolating quotient coordinates,
  spectral closure, pointwise mixing, boundary mode, axis selection, and group-sharing
  size under one common training and profiling protocol.
common_args:
  data_path: data
  device: cuda
  weights: DEFAULT
  input_size: 224
  imagenet_norm: true
  imagenet_default_mean_and_std: true
  update_freq: 1
  deterministic: true
  num_workers: 2
  use_amp: true
  pin_mem: true
  dist_eval: false
  final_test: true
  save_history: true
  save_ckpt: true
  profile_efficiency: true
  profile_batch_size: 16
  measure_eval_latency: true
  enable_wandb: false
  val_ratio: 0.1
method_presets:
  dt1d:
    label: DT1D/SCDQ ablation
    args:
      tuning_method: dt
      freeze_backbone: true
      dt_M: 1
      dt_h: 1
      dt_dilations: 1,2,4
      dt_scale_adaptive: true
      dt_separate_axis_kernels: true
      dt_gate_temperature: 1.0
      dt_input_adaptive_gate: false
      dt_axis: hw
      dt_alpha_group: 16
      dt_pw_ratio: 32
      dt_pw_groups: 4
      dt_gate_init: 0.01
      adapt_scale: 1.0
all_cnn_methods:
- dt1d
targets:
  table_14_15_scdq_ablation:
    kind: ablation
    manuscript_tables:
    - 14
    - 15
    dataset: caltech101
    backbone: resnet18
    epochs: 10
    batch_size: 64
    args:
      val_ratio: 0.1
      test_ratio: 0.1
    methods:
    - dt1d
    variants:
      legacy_v8_reflect_pointwise:
        dt_exact_cost_realization: true
        dt_closed_form_dyadic_realization: true
        dt_minimal_quotient_realization: false
        dt_quotient_support_cap: 8
        dt_no_pw: false
        dt_padding: reflect
      legacy_v8_reflect_core:
        dt_exact_cost_realization: true
        dt_closed_form_dyadic_realization: true
        dt_minimal_quotient_realization: false
        dt_quotient_support_cap: 8
        dt_no_pw: true
        dt_padding: reflect
      legacy_v8_replicate_pointwise:
        dt_exact_cost_realization: true
        dt_closed_form_dyadic_realization: true
        dt_minimal_quotient_realization: false
        dt_quotient_support_cap: 8
        dt_no_pw: false
        dt_padding: replicate
      mlq8_replicate_pointwise:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 8
        dt_no_pw: false
        dt_padding: replicate
      mlq8_replicate_core:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 8
        dt_no_pw: true
        dt_padding: replicate
      scdq4_reflect_pointwise:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 4
        dt_no_pw: false
        dt_padding: reflect
      scdq4_reflect_core_final:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 4
        dt_no_pw: true
        dt_padding: reflect
      scdq4_replicate_core:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 4
        dt_no_pw: true
        dt_padding: replicate
      scdq4_height_core:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 4
        dt_no_pw: true
        dt_padding: reflect
        dt_axis: h
      scdq4_width_core:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 4
        dt_no_pw: true
        dt_padding: reflect
        dt_axis: w
      scdq4_group8_core:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
        dt_minimal_quotient_realization: true
        dt_quotient_support_cap: 4
        dt_no_pw: true
        dt_padding: reflect
        dt_alpha_group: 8
      scdq4_group32_core:
        dt_exact_cost_realization: false
        dt_closed_form_dyadic_realization: false
